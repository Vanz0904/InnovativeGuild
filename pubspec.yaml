name: safeguard_app
description: "SafeGuard — Secure Escrow Payment Platform. Premium fintech UI demo."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"